name: Publish Custom Installer

on:
  push:
    branches:
      - main
      - cursor/omer-melodic-house-features-849d
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip3 install Pillow fonttools
      
      - name: Build installer site
        run: |
          mkdir -p _site
          python3 web/make_site.py release/felucca-V10.8.48.fwsc V10.8.48 _site
          echo "Official JIANT Installer - Costa OS Compatible" > _site/README.md
          echo "Open webapp/installer/ to install official JIANT firmware" >> _site/README.md
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
